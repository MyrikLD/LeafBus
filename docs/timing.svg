<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="sans-serif" font-size="12">
  <rect width="900" height="330" fill="#fff"/>
  <text x="20" y="26" font-weight="bold" font-size="14">Bus timing, stock controller</text>

  <!-- start-up -->
  <text x="20" y="58" font-weight="bold">Start-up</text>
  <line x1="20" y1="100" x2="880" y2="100" stroke="#999"/>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="80" width="26" height="20" fill="#cfe3ff" stroke="#333"/><text x="73" y="94">00</text>
    <text x="73" y="118">root side detect</text>
    <text x="73" y="132" fill="#555">no reply</text>
    <text x="150" y="76" fill="#555">~100 ms</text>
    <rect x="200" y="80" width="26" height="20" fill="#cfe3ff" stroke="#333"/><text x="213" y="94">80</text>
    <text x="213" y="118">layout</text><text x="213" y="132">detect</text>
    <rect x="240" y="80" width="150" height="20" fill="#f6c343" stroke="#333"/><text x="315" y="94">B1 B0 04 … 95 40</text>
    <text x="330" y="118">layout string, ends with 40</text>
    <text x="330" y="132" fill="#555">latency grows with hop count</text>
    <rect x="440" y="80" width="44" height="20" fill="#cfe3ff" stroke="#333"/><text x="462" y="94">FC 04 BR</text>
    <text x="462" y="118">brightness</text>
    <rect x="520" y="80" width="120" height="20" fill="#cfe3ff" stroke="#333"/><text x="580" y="94">E0 03 05 T R G B W …</text>
    <text x="580" y="118">bulk push, N chunks</text>
    <rect x="700" y="80" width="26" height="20" fill="#cfe3ff" stroke="#333"/><text x="713" y="94">C0</text>
    <rect x="726" y="80" width="50" height="20" fill="#f6c343" stroke="#333"/><text x="751" y="94">00 00 ×N</text>
    <text x="738" y="118">first bulk pull</text>
  </g>

  <!-- steady state -->
  <text x="20" y="180" font-weight="bold">Steady state</text>
  <line x1="20" y1="222" x2="880" y2="222" stroke="#999"/>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="202" width="22" height="20" fill="#cfe3ff" stroke="#333"/><text x="71" y="216">C0</text>
    <rect x="82" y="202" width="34" height="20" fill="#f6c343" stroke="#333"/><text x="99" y="216">00 00</text>
    <rect x="260" y="202" width="22" height="20" fill="#cfe3ff" stroke="#333"/><text x="271" y="216">C0</text>
    <rect x="282" y="202" width="34" height="20" fill="#f6c343" stroke="#333"/><text x="299" y="216">00 00</text>
    <rect x="330" y="202" width="120" height="20" fill="#cfe3ff" stroke="#333"/><text x="390" y="216">E0 03 05 0A C2 CB 00 00</text>
    <text x="390" y="240">bulk push, any time between polls</text>
    <rect x="460" y="202" width="22" height="20" fill="#cfe3ff" stroke="#333"/><text x="471" y="216">C0</text>
    <rect x="482" y="202" width="34" height="20" fill="#f6c343" stroke="#333"/><text x="499" y="216">11 00</text>
    <text x="499" y="256">touch</text>
    <rect x="660" y="202" width="22" height="20" fill="#cfe3ff" stroke="#333"/><text x="671" y="216">C0</text>
    <rect x="682" y="202" width="34" height="20" fill="#f6c343" stroke="#333"/><text x="699" y="216">00 00</text>
    <rect x="740" y="202" width="44" height="20" fill="#cfe3ff" stroke="#333"/><text x="762" y="216">FC 04 B2</text>
    <text x="762" y="240">brightness</text>
  </g>
  <g stroke="#333" fill="none">
    <path d="M71 196 v-10 h200 v10" />
    <path d="M271 196 v-10 h200 v10" />
    <path d="M471 196 v-10 h200 v10" />
  </g>
  <g font-size="11" text-anchor="middle" fill="#333">
    <text x="171" y="182">50 ms</text><text x="371" y="182">50 ms</text><text x="571" y="182">50 ms</text>
  </g>
  <g font-size="11">
    <rect x="20" y="285" width="14" height="12" fill="#cfe3ff" stroke="#333"/><text x="40" y="295">master → panels</text>
    <rect x="160" y="285" width="14" height="12" fill="#f6c343" stroke="#333"/><text x="180" y="295">panels → master (2 bytes per panel on C0)</text>
    <text x="20" y="318" fill="#555">Median bulk pull period 50.1 ms, jitter under 1 ms. Without the poll the panels apply only the first color frame. PROTOCOL.md §4.2 — MIT</text>
  </g>
</svg>
